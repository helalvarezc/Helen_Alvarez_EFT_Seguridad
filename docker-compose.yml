services:
  db:
    image: mysql:8.4
    container_name: vet-db
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
    networks:
      - vet_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  backend:
    build: .
    container_name: vet-backend
    environment:
      DB_URL: jdbc:mysql://db:3306/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      CORS_ORIGINS: ${CORS_ORIGINS}
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - vet_net
    restart: unless-stopped

  proxy:
    build: ./apache
    container_name: vet-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./apache/certs:/usr/local/apache2/conf/certs:ro
    depends_on:
      - backend
    networks:
      - vet_net
    restart: unless-stopped

volumes:
  db_data:

networks:
  vet_net:
    driver: bridge
